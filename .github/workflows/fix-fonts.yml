name: Fix Google Fonts async loading
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix-fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run fonts fix script
        run: python3 fix-google-fonts.py
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "perf: async Google Fonts loading sitewide"
          git push
