name: Inject perf-optimise.js into all HTML files
 
on:
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Run injection script
        run: python3 inject-perf-script.py
 
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "perf: inject perf-optimise.js sitewide"
          git push
