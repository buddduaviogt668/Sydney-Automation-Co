name: Inject perf-init.js into all HTML files
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run inject script
        run: python inject-perf-script.py
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "perf: remove hardcoded FB/Clarity, inject perf-init.js sitewide"
          git push
